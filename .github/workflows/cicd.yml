name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        # TODO 1: Viet lenh de chay pytest tren thu muc tests/ voi co -v
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        # TODO 2: Ghi noi dung credentials ra file tam va set bien moi truong xac thuc.
        run: |
          python - <<'PYEOF'
          import os, json
          creds_raw = os.environ.get("STORAGE_CREDENTIALS", "")
          try:
              creds = json.loads(creds_raw)
              aws_key = creds.get("aws_access_key_id", "")
              aws_secret = creds.get("aws_secret_access_key", "")
              aws_region = creds.get("aws_region", "ap-southeast-1")
          except Exception:
              lines = [line.strip() for line in creds_raw.splitlines() if line.strip()]
              aws_key = lines[0] if len(lines) > 0 else ""
              aws_secret = lines[1] if len(lines) > 1 else ""
              aws_region = "ap-southeast-1"

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"AWS_ACCESS_KEY_ID={aws_key}\n")
              f.write(f"AWS_SECRET_ACCESS_KEY={aws_secret}\n")
              f.write(f"AWS_DEFAULT_REGION={aws_region}\n")
          PYEOF
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}

      - name: Pull data with DVC
        # TODO 3: Pull cac file du lieu can thiet tu cloud storage bang lenh dvc pull.
        run: dvc pull data/train_batch1.csv data/holdout.csv

      - name: Train model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || 'sqlite:///mlflow.db' }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME || '' }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN || '' }}
          MLFLOW_ARTIFACT_ROOT: "./mlartifacts"
        run: python src/train.py

      - name: Read report
        id: read_report
        # TODO 4: Doc gia tri "f1_score" tu outputs/report.json bang Python inline.
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Upload model and report to Cloud Storage
        # TODO 5 & BONUS 4: Upload model.joblib va report.json len S3
        run: |
          python - <<'PYEOF'
          import boto3
          import os

          bucket_name = os.environ["ARTIFACT_BUCKET"]
          s3 = boto3.client("s3")
          s3.upload_file("models/model.joblib", bucket_name, "artifacts/current/model.joblib")
          s3.upload_file("outputs/report.json", bucket_name, "artifacts/current/report.json")
          print("Uploaded model.joblib and report.json to S3 successfully.")
          PYEOF
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}

      - name: Save reports as artifacts
        # BONUS 3: Luu ca report.json va detail.txt
        uses: actions/upload-artifact@v4
        with:
          name: model-reports
          path: |
            outputs/report.json
            outputs/detail.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE & BONUS 4 (ROLLBACK CHECK)
  # Kiem tra nguong chat luong (f1_score >= 0.65) va so sanh voi model cu.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Cloud Storage
        run: |
          python - <<'PYEOF'
          import os, json
          creds_raw = os.environ.get("STORAGE_CREDENTIALS", "")
          try:
              creds = json.loads(creds_raw)
              aws_key = creds.get("aws_access_key_id", "")
              aws_secret = creds.get("aws_secret_access_key", "")
              aws_region = creds.get("aws_region", "ap-southeast-1")
          except Exception:
              lines = [line.strip() for line in creds_raw.splitlines() if line.strip()]
              aws_key = lines[0] if len(lines) > 0 else ""
              aws_secret = lines[1] if len(lines) > 1 else ""
              aws_region = "ap-southeast-1"

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"AWS_ACCESS_KEY_ID={aws_key}\n")
              f.write(f"AWS_SECRET_ACCESS_KEY={aws_secret}\n")
              f.write(f"AWS_DEFAULT_REGION={aws_region}\n")
          PYEOF
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}

      - name: Check quality gate and rollback condition
        # TODO 6 & BONUS 4: Kiem tra F1 >= 0.65 va so sanh voi F1 cu tu S3
        run: |
          python - <<'PYEOF'
          import os, json, boto3
          from botocore.exceptions import ClientError

          f1 = float("${{ needs.train.outputs.f1 }}")
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
          print(f"PASSED Quality Gate: f1_score {f1:.4f} >= 0.65.")

          # BONUS 4: Kiem tra khong bi thoai lui so voi model cu tren S3
          bucket_name = os.environ["ARTIFACT_BUCKET"]
          s3 = boto3.client("s3")
          try:
              s3.download_file(bucket_name, "artifacts/current/report.json", "/tmp/old_report.json")
              with open("/tmp/old_report.json") as f:
                  old_data = json.load(f)
              old_f1 = float(old_data.get("f1_score", 0.0))
              print(f"[BONUS 4] So sanh F1: Model moi ({f1:.4f}) vs Model cu ({old_f1:.4f})")
              if f1 < old_f1 - 0.05:  # Cho phep sai so nho do lay mau
                  raise SystemExit(f"FAILED (ROLLBACK): F1 moi ({f1:.4f}) bi sut giam dang ke so voi F1 cu ({old_f1:.4f}). Huy trien khai.")
              print("PASSED Rollback Check: Model moi dat chat luong tuong duong hoac tot hon.")
          except ClientError as e:
              print("[BONUS 4] Khong tim thay model cu tren S3 hoac day la lan chay dau tien. Tiep tuc trien khai.")
          except Exception as e:
              print(f"[BONUS 4 Note] {e}. Tiep tuc trien khai.")
          PYEOF
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            curl -sf http://localhost:8080/healthz && echo "Health check passed." || exit 1
